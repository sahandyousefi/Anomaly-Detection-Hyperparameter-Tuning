seed: 42

paths:
  raw_data: data/raw/PS_20174392719_1491204439457_log.csv
  artifacts: artifacts
  figures: reports/figures

data:
  target: isFraud
  time_column: step
  id_columns: [nameOrig, nameDest]
  # isFlaggedFraud is the simulator's own rule output, kept only for the rule baseline
  drop_columns: [isFlaggedFraud]

# Set balance_features to false to measure how much the model relies on the
# balance reconciliation residuals, which are partly a simulator artifact.
# history_length > 0 appends each account's most recent earlier transactions
# as lag columns; the GRU model requires it.
features:
  balance_features: true
  history_length: 0
  history_roles: [orig, dest]

# Fractions refer to the ordered range of hourly steps, not to row counts
split:
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

# Applied to the training fold only
resampling:
  method: undersample  # none | undersample | smote | class_weight
  sampling_strategy: 0.1

# Same settings as the original notebook, kept as the reference point before tuning
model:
  name: xgboost
  params:
    n_estimators: 750
    learning_rate: 0.3
    max_depth: 7
    tree_method: hist
    eval_metric: aucpr
    n_jobs: -1

evaluation:
  threshold_strategy: cost  # cost | target_recall
  cost_false_positive: 1.0
  cost_false_negative: 25.0
  target_recall: 0.90

# MLflow run logging; also switched on by `fraud-detection train --track`.
# A null tracking_uri uses MLFLOW_TRACKING_URI or MLflow's local default.
tracking:
  enabled: false
  tracking_uri: null
  experiment_name: paysim-fraud-detection
  artifact_location: null
  log_model: true
