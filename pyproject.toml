[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "Fraud detection on the PaySim mobile money dataset with gradient boosting, anomaly detection, and SHAP-based explanations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sahand Yousefi" }]
keywords = ["fraud detection", "anomaly detection", "xgboost", "shap", "paysim"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0,<4",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10",
    "imbalanced-learn>=0.11",
    "xgboost>=2.0,<4",
    "shap>=0.44",
    "matplotlib>=3.7,<4",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pre-commit>=3.5",
]
gbm = [
    "lightgbm>=4.0",
    "catboost>=1.2",
]
tune = [
    "optuna>=3.4",
]
dl = [
    "torch>=2.1",
]
track = [
    "mlflow>=3.0",
]
serve = [
    "fastapi>=0.110",
    "pydantic>=2.5,<3",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
fraud-detection = "fraud_detection.cli:main"

[project.urls]
Repository = "https://github.com/sahandyousefi/Anomaly-Detection-Hyperparameter-Tuning"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
# The original notebook is kept unchanged as a record of the first analysis
extend-exclude = ["notebooks/00_original_exploration.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["fraud_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
